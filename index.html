    <body class="bg-[#025e49] dark:bg-[#011818] text-[#f5f5f5] dark:text-[#dae5e7] selection:bg-[#00f1a9a3] selection:text-[#00332e] antialiased">

                <div class="container-js">
                    <div class="content-js">
                        <h2>Ops! Para continuar, precisamos do JavaScript ativo.</h2>
                        <p>Parece que seu navegador está com o JavaScript desabilitado. Sem ele, não conseguimos carregar o design interativo e as funcionalidades principais da nossa página.</p>
                        <p><strong>Siga este passo a passo rápido:</strong></p>
                        <ul>
                            <li>Entre nas <b>Configurações</b> do seu navegador.</li>
                            <li>Busque por <b>Privacidade e segurança</b>.</li>

                            <li>Ative a opção <b>JavaScript</b>.</li>
                        </ul>
                        <p><strong>Tudo pronto?</strong></p>
                        <p>Basta atualizar a página para aproveitar a experiência completa.</p>
                        <p><a href="https://www.enable-javascript.com/pt/" target="_blank">Ainda tem dúvidas? Clique aqui para um guia visual</a></p>
                        <p><em>Agradecemos a compreensão. Isso garante que você navegue em um ambiente mais rápido e funcional.</em></p>
                    </div>
                </div>
            </div>
